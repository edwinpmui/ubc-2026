# Runs Penny against Arc Testnet. Configure values in .env (see .env.example).
services:
  deploy:
    build: ./contracts
    profiles: [deploy]
    command: npx hardhat run scripts/deploy.js --network arcTestnet
    environment:
      DEPLOYER_PRIVATE_KEY: ${DEPLOYER_PRIVATE_KEY:?set DEPLOYER_PRIVATE_KEY in .env}
      ARC_RPC_URL: ${ARC_RPC_URL:-https://rpc.testnet.arc.network}

  web:
    build: ./web
    ports:
      - "3000:3000"
    environment:
      RPC_URL: ${ARC_RPC_URL:-https://rpc.testnet.arc.network}
      CHAIN_ID: "5042002"
      EXPLORER_URL: https://testnet.arcscan.app
      PENNY_CONTRACT_ADDRESS: ${PENNY_CONTRACT_ADDRESS:?set PENNY_CONTRACT_ADDRESS in .env}
      TREASURY_PRIVATE_KEY: ${TREASURY_PRIVATE_KEY:-}
      WELCOME_BONUS: ${WELCOME_BONUS:-1}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
      KEY_ENCRYPTION_SECRET: ${KEY_ENCRYPTION_SECRET:?set KEY_ENCRYPTION_SECRET in .env}
      SECURE_COOKIES: ${SECURE_COOKIES:-false}
    volumes:
      - penny-data:/data

volumes:
  penny-data:
